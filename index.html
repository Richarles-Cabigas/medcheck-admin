<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedCheck Admin — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="login-screen">
      <div class="login-card">
        <div class="login-mark">MC</div>
        <h1>MedCheck Admin</h1>
        <p class="subtitle">Sign in to review doctor verification requests.</p>

        <div class="login-error" id="login-error"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="username"
              required
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit" class="btn-primary" id="login-submit">
            Sign in
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
