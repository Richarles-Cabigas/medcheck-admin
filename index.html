<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedCheck Admin — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* Scoped to the password field's show/hide toggle only —
         doesn't touch anything in style.css. */
      .password-field-wrap {
        position: relative;
      }
      .password-field-wrap input {
        padding-right: 42px;
        width: 100%;
        box-sizing: border-box;
      }
      .btn-toggle-password {
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        padding: 4px;
        margin: 0;
        cursor: pointer;
        color: #6b7280;
        line-height: 0;
      }
      .btn-toggle-password:hover {
        color: #111827;
      }
      .btn-toggle-password:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="login-screen">
      <div class="login-card">
        <div class="login-mark">MC</div>
        <h1>MedCheck Admin</h1>
        <p class="subtitle">Sign in to review doctor verification requests.</p>

        <div class="login-error" id="login-error"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="username"
              required
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-field-wrap">
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="btn-toggle-password"
                id="toggle-password"
                aria-label="Show password"
                tabindex="-1"
              >
                <svg
                  id="toggle-password-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-primary" id="login-submit">
            Sign in
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
